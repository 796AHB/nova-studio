<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0c11">
<meta name="description" content="AHB Broin — your own multi-provider AI studio: chat, images, video, voice, skills and usage tracking.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AHB Broin">
<title>AHB Broin</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Chats">
    <div class="side-head"><span class="brand">⚡ AHB Broin</span><button class="icon" id="closeSide" aria-label="Close menu">✕</button></div>
    <button class="btn primary" id="newChat">＋ New chat <kbd>Ctrl K</kbd></button>
    <div id="projBar"></div>
    <div class="side-tools">
      <button class="chip sm" id="openKB">📚 Knowledge</button>
      <button class="chip sm" id="openCompare">⚖️ Compare</button>
      <button class="chip sm" id="openGallery">🖼️ Gallery</button>
      <button class="chip sm" id="openTasks">⏰ Tasks</button>
      <button class="chip sm" id="openRuns">▶ Runs</button>
    </div>
    <input id="search" type="search" placeholder="🔎 Search chats" aria-label="Search chats">
    <div id="convoList"></div>
    <button class="btn install" id="installBtn" hidden>📲 Install app</button>
    <div class="side-foot">
      <button class="btn ghost" id="openFiles">📁<span>Files</span></button>
      <button class="btn ghost" id="openConnectors">🔌<span>Connect</span></button>
      <button class="btn ghost" id="openSkills">🧩<span>Skills</span></button>
      <button class="btn ghost" id="openUsage">📊<span>Usage</span></button>
      <button class="btn ghost" id="openSettings">⚙️<span>Settings</span></button>
    </div>
  </aside>
  <div id="scrim"></div>
  <main>
    <div id="offline" hidden>📴 You're offline — chats are still readable; sending needs a connection.</div>
    <header>
      <button class="icon" id="openSide" aria-label="Open menu">☰</button>
      <button id="modelChip" title="Choose provider & model"></button>
      <button id="usagePill" class="pill" title="Usage"></button>
      <button class="icon" id="chatMenu" title="Chat options" aria-label="Chat options">⋯</button>
      <button class="icon" id="newChat2" title="New chat" aria-label="New chat">✏️</button>
    </header>
    <div id="messages" aria-live="polite"></div>
    <button id="fab" hidden aria-label="Scroll to latest">↓</button>
    <div id="composer">
      <div class="ctop">
        <div class="modes" id="modes" role="group" aria-label="Mode">
          <button data-mode="chat">💬<span> Chat</span></button>
          <button data-mode="image">🎨<span> Image</span></button>
          <button data-mode="video">🎬<span> Video</span></button>
        </div>
        <div id="skillBar"></div>
      </div>
      <div id="attachBar"></div>
      <div class="box-wrap">
        <div id="slashMenu" role="listbox" hidden></div>
        <div id="attachMenu" class="popmenu" hidden>
          <button data-am="upload">📎 <span>Upload from this device</span></button>
          <button data-am="camera">📷 <span>Take a photo</span></button>
          <button data-am="files">📁 <span>Browse my files & folders</span></button>
        </div>
        <div class="box" id="box">
          <button class="icon" id="attachBtn" title="Attach files" aria-label="Attach files">📎</button>
          <input type="file" id="fileInput" multiple hidden>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
          <textarea id="input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
          <button class="icon" id="micBtn" title="Voice input" aria-label="Voice input">🎙️</button>
          <button class="icon" id="voiceBtn" title="Live voice conversation" aria-label="Live voice conversation">🎧</button>
          <button class="send" id="sendBtn" title="Send" aria-label="Send">➤</button>
        </div>
      </div>
    </div>
  </main>
</div>
<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" role="status"></div>

<noscript><p style="padding:20px">AHB Broin needs JavaScript.</p></noscript>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
